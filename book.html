<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>RecruitStar | Book your interview</title><style>body{font:17px system-ui;background:#f1f5f9;color:#172b40;margin:0}main{max-width:560px;margin:24px auto;padding:24px;background:white;border-radius:16px}button{display:block;width:100%;padding:14px;margin:8px 0;border:1px solid #b8c8d8;border-radius:8px;background:white;color:#172b40;font:inherit;cursor:pointer}button:disabled{opacity:.5}h1{font-size:26px}#confirm{background:#164e63;color:white}p{line-height:1.5}</style><main><h1>Book your Install America interview</h1><p>Choose one 30-minute interview. All times are Eastern.</p><p id="status" role="status" aria-live="polite">Loading available times…</p><div id="slots"></div><button id="confirm" hidden>Confirm interview</button></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token')||new URLSearchParams(location.search).get('token');history.replaceState(null,'',location.pathname);const status=document.getElementById('status'),slots=document.getElementById('slots'),confirm=document.getElementById('confirm');let selected=null,busy=false;const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZoneName:'short'});async function api(slot){const r=await fetch('https://wlxmtmrxkgrsvbwzeecs.supabase.co/functions/v1/recruitstar-booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(slot?{token,slot}:{token})});const j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}async function load(){slots.replaceChildren();confirm.hidden=true;selected=null;if(!token){status.textContent='Please open your private invitation link.';return}try{const j=await api();status.textContent=j.slots.length?'Select an available time.':'No interview times are currently available. Please contact recruiting.';for(const s of j.slots){const b=document.createElement('button');b.textContent=fmt.format(new Date(s.starts_at));b.setAttribute('aria-pressed','false');b.onclick=()=>{if(busy)return;selected=s;for(const x of slots.children){x.style.background='white';x.setAttribute('aria-pressed','false')}b.style.background='#dbeafe';b.setAttribute('aria-pressed','true');confirm.hidden=false;confirm.textContent='Confirm '+b.textContent};slots.append(b)}}catch(e){status.textContent=e.message}}confirm.onclick=async()=>{if(!selected||busy)return;busy=true;confirm.disabled=true;try{const j=await api(selected.id);if(!j.booked)throw Error('Booking not confirmed');status.textContent='Your interview is booked for '+fmt.format(new Date(selected.starts_at))+'.';slots.replaceChildren();confirm.hidden=true}catch(e){await load();status.textContent=e.message+' — please select another time or contact recruiting.'}finally{busy=false;confirm.disabled=false}};load();
</script></html>
